name: Daily commit check

on:
  workflow_dispatch:
  schedule:
    # 19:00 UTC = 21:00 en España durante el horario de verano (CEST),
    # 20:00 durante el horario de invierno (CET).
    - cron: "0 19 * * *"

permissions:
  issues: write

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Calcular el inicio del día en hora española
        id: daterange
        run: |
          TODAY=$(TZ=Europe/Madrid date +%Y-%m-%d)
          OFFSET=$(TZ=Europe/Madrid date +%z)          # p.ej. +0200
          START="${TODAY}T00:00:00${OFFSET:0:3}:${OFFSET:3:2}"
          {
            echo "today=${TODAY}"
            echo "start=${START}"
            echo "title=⚠️ Sin commits hoy - $(TZ=Europe/Madrid date +%d/%m/%Y)"
          } >> "$GITHUB_OUTPUT"
          echo "Buscando commits desde ${START}"

      - name: Buscar mis commits de hoy en todos mis repos
        id: search
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
          AUTHOR: dierodfer
          START: ${{ steps.daterange.outputs.start }}
        run: |
          RESPONSE=$(curl -sS -G "https://api.github.com/search/commits" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "q=author:${AUTHOR} author-date:>=${START}" \
            --data-urlencode "per_page=1")

          COUNT=$(echo "$RESPONSE" | jq -r '.total_count // "error"')
          if [ "$COUNT" = "error" ]; then
            echo "::error::La API de búsqueda de commits no devolvió un resultado válido."
            echo "$RESPONSE"
            exit 1
          fi

          echo "Commits encontrados hoy: ${COUNT}"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Crear issue si no hay ningún commit
        if: steps.search.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: ${{ steps.daterange.outputs.title }}
          TODAY: ${{ steps.daterange.outputs.today }}
        run: |
          EXISTING=$(gh issue list --repo "$REPO" --state open --limit 50 --json title \
            | jq --arg t "$TITLE" '[.[] | select(.title == $t)] | length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Ya existe un issue abierto para hoy; no se crea otro."
            exit 0
          fi

          BODY=$(cat <<EOF
          No se ha detectado ningún commit tuyo hoy (${TODAY}) en ninguno de tus repositorios, desde las 00:00 hora española hasta ahora.

          Haz al menos un commit antes de medianoche para mantener tu racha 💪
          EOF
          )
          gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
