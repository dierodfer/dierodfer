name: Update language metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dierodfer
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          filename: languages.svg

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dierodfer
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: calendar.svg

      - name: Compute total contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total=$(gh api graphql -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                  }
                }
              }
            }' -f login="dierodfer" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          echo "Total contributions (last year): $total"

          cat > contributions.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Contributions (last year)",
            "message": "${total}",
            "color": "blue"
          }
          EOF

          sha=$(gh api "repos/${{ github.repository }}/contents/contributions.json" --jq '.sha' 2>/dev/null || true)

          if [ -n "$sha" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/contributions.json" \
              -f message="Update contributions.json [skip ci]" \
              -f content="$(base64 -w0 contributions.json)" \
              -f sha="$sha" \
              -f branch="${{ github.ref_name }}"
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/contributions.json" \
              -f message="Add contributions.json [skip ci]" \
              -f content="$(base64 -w0 contributions.json)" \
              -f branch="${{ github.ref_name }}"
          fi
